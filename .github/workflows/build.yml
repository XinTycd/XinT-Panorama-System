name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:vendor
      - name: Create isolated runtime storage
        run: |
          mkdir -p "$RUNNER_TEMP/xint-panorama-ci-storage"
          echo "PANORAMA_STORAGE_DIR=$RUNNER_TEMP/xint-panorama-ci-storage" >> "$GITHUB_ENV"
      - run: npm run check:config
      - run: npm test
