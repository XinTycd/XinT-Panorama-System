<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XinT-Panorama-System Widget</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --panel: rgba(7, 7, 7, 0.9);
        --line: #2b2b2b;
        --line-strong: #5f5f5f;
        --text: #f4f4f4;
        --text-soft: #b8b8b8;
        --white: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: "Segoe UI Variable", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      button {
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      .shell {
        width: 100%;
        height: 100%;
      }
      .viewer-shell {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 220px;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(180deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          #050505;
        background-size: 44px 44px;
      }
      #viewer {
        width: 100%;
        height: 100%;
      }
      #viewer canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #viewer canvas:active {
        cursor: grabbing;
      }
      .viewer-top,
      .toolbar {
        position: absolute;
        left: 14px;
        right: 14px;
        z-index: 2;
      }
      .viewer-top {
        top: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
        pointer-events: none;
      }
      .hud,
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .toolbar {
        bottom: 14px;
      }
      .chip,
      .button {
        min-height: 38px;
        padding: 0 12px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
      }
      .chip {
        max-width: 100%;
        overflow-wrap: anywhere;
      }
      .button {
        cursor: pointer;
      }
      .button:hover {
        border-color: var(--line-strong);
        background: rgba(28, 28, 28, 0.94);
      }
      .button.primary {
        color: #050505;
        border-color: var(--white);
        background: var(--white);
      }
      .modebar {
        display: inline-grid;
        grid-template-columns: repeat(4, minmax(76px, 1fr));
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        pointer-events: auto;
      }
      .mode-button {
        min-height: 32px;
        padding: 0 10px;
        border: 0;
        border-radius: 6px;
        color: var(--text-soft);
        background: transparent;
        cursor: pointer;
        white-space: nowrap;
      }
      .mode-button:hover {
        color: var(--white);
        background: #242424;
      }
      .mode-button.active {
        color: #050505;
        background: var(--white);
      }
      @media (max-width: 640px) {
        .viewer-top,
        .toolbar {
          left: 10px;
          right: 10px;
        }
        .modebar {
          width: 100%;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .toolbar {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .button {
          justify-content: center;
          padding: 0 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="viewer-shell">
        <div id="viewer"></div>
        <div class="viewer-top">
          <div class="hud">
            <span id="statusText" class="chip">加载中...</span>
            <span id="panoramaNoText" class="chip">编号: -</span>
            <span id="resolutionText" class="chip">分辨率: -</span>
          </div>
          <div class="modebar" role="group" aria-label="预览模式">
            <button class="mode-button active" data-mode="expand" type="button">展开</button>
            <button class="mode-button" data-mode="planet" type="button">小行星</button>
            <button class="mode-button" data-mode="tunnel" type="button">隧道</button>
            <button class="mode-button" data-mode="crystal" type="button">水晶球</button>
          </div>
        </div>
        <div class="toolbar">
          <button id="prevBtn" class="button" type="button">上一张</button>
          <button id="nextBtn" class="button" type="button">下一张</button>
          <button id="autorotateBtn" class="button primary" type="button">关闭自动旋转</button>
          <button id="resetBtn" class="button" type="button">重置视角</button>
          <button id="fullscreenBtn" class="button" type="button">全屏</button>
        </div>
      </div>
    </div>

    <script src="/assets/three.min.js"></script>
    <script src="/assets/panorama-viewer.js"></script>
    <script>
      (function initWidget() {
        var params = new URLSearchParams(location.search);
        var apiBase = (params.get("api") || location.origin).replace(/\/$/, "");
        var fixedPanoramaNo = params.get("panoramaNo");
        var externalImageUrl = params.get("imageUrl");
        var externalImageName = params.get("imageName") || "外部全景图";
        var initialAutorotate = params.get("autorotate") !== "0";
        var previewMode = XinTPanoramaViewer.normalizeMode(params.get("mode") || "expand");
        var refs = {
          viewer: document.getElementById("viewer"),
          statusText: document.getElementById("statusText"),
          panoramaNoText: document.getElementById("panoramaNoText"),
          resolutionText: document.getElementById("resolutionText"),
          prevBtn: document.getElementById("prevBtn"),
          nextBtn: document.getElementById("nextBtn"),
          autorotateBtn: document.getElementById("autorotateBtn"),
          resetBtn: document.getElementById("resetBtn"),
          fullscreenBtn: document.getElementById("fullscreenBtn"),
          modeButtons: Array.prototype.slice.call(document.querySelectorAll(".mode-button"))
        };
        var state = {
          items: [],
          currentIndex: -1,
          requestId: 0,
          maxTextureSize: 4096,
          autorotate: initialAutorotate,
          viewerController: null
        };

        initViewer();
        bindEvents();
        loadInitialData();

        function initViewer() {
          state.viewerController = XinTPanoramaViewer.create({
            element: refs.viewer,
            THREE: THREE,
            initialMode: previewMode,
            autorotate: state.autorotate
          });
          state.maxTextureSize = state.viewerController.getMaxTextureSize();
          updateModeButtons();
          updateAutorotateText();
        }

        function bindEvents() {
          refs.prevBtn.addEventListener("click", function onPrev() {
            moveSelection(-1);
          });
          refs.nextBtn.addEventListener("click", function onNext() {
            moveSelection(1);
          });
          refs.autorotateBtn.addEventListener("click", toggleAutorotate);
          refs.resetBtn.addEventListener("click", function onReset() {
            state.viewerController.resetView();
          });
          refs.fullscreenBtn.addEventListener("click", toggleFullscreen);
          refs.modeButtons.forEach(function bindMode(button) {
            button.addEventListener("click", function onModeClick() {
              previewMode = state.viewerController.setMode(button.getAttribute("data-mode"));
              updateModeButtons();
            });
          });
        }

        function loadInitialData() {
          if (externalImageUrl) {
            hidePaging();
            state.items = [
              {
                id: "external-image",
                panoramaNo: null,
                name: externalImageName,
                sourceType: "external-url",
                viewerUrl: apiBase + "/api/panoramas/proxy?url=" + encodeURIComponent(externalImageUrl)
              }
            ];
            selectScene(0);
            return;
          }

          if (fixedPanoramaNo) {
            hidePaging();
            fetch(apiBase + "/api/panoramas/by-no?no=" + encodeURIComponent(fixedPanoramaNo))
              .then(toJson)
              .then(function onPayload(payload) {
                state.items = payload.item ? [payload.item] : [];
                if (!state.items.length) {
                  throw new Error("not found");
                }
                selectScene(0);
              })
              .catch(function onError() {
                refs.statusText.textContent = "指定编号的全景图不存在";
              });
            return;
          }

          fetch(apiBase + "/api/gallery")
            .then(toJson)
            .then(function onPayload(payload) {
              state.items = payload.items || [];
              if (!state.items.length) {
                refs.statusText.textContent = "暂无可用全景图";
                return;
              }
              selectScene(0);
            })
            .catch(function onError() {
              refs.statusText.textContent = "后端不可用";
            });
        }

        function hidePaging() {
          refs.prevBtn.style.display = "none";
          refs.nextBtn.style.display = "none";
        }

        function toJson(response) {
          if (!response.ok) {
            throw new Error("request failed");
          }
          return response.json();
        }

        function selectScene(index) {
          if (index < 0 || index >= state.items.length) {
            return;
          }

          var item = state.items[index];
          var requestId = ++state.requestId;
          state.currentIndex = index;
          refs.statusText.textContent = "加载中...";
          refs.panoramaNoText.textContent = item.panoramaNo ? "编号: #" + item.panoramaNo : "来源: 外部 URL";

          loadTexture(item.viewerUrl)
            .then(function onLoaded(loaded) {
              if (requestId !== state.requestId) {
                loaded.texture.dispose();
                return;
              }

              state.viewerController.setTexture(loaded.texture);
              refs.resolutionText.textContent = "分辨率: " + loaded.originalWidth + " × " + loaded.originalHeight;
              refs.statusText.textContent = "已就绪: " + item.name;
            })
            .catch(function onError() {
              state.viewerController.clear();
              refs.resolutionText.textContent = "分辨率: -";
              refs.statusText.textContent = "加载失败";
            });
        }

        function loadTexture(url) {
          return loadImageSource(url).then(function buildTexture(source) {
            var originalWidth = source.naturalWidth || source.width;
            var originalHeight = source.naturalHeight || source.height;
            var scale = Math.min(1, Math.max(1024, state.maxTextureSize || 4096) / Math.max(originalWidth, originalHeight));
            var scaledWidth = Math.max(1, Math.round(originalWidth * scale));
            var scaledHeight = Math.max(1, Math.round(originalHeight * scale));
            var canvas = document.createElement("canvas");
            var context = canvas.getContext("2d", { alpha: false, desynchronized: true });
            var texture;

            canvas.width = scaledWidth;
            canvas.height = scaledHeight;
            context.drawImage(source, 0, 0, scaledWidth, scaledHeight);
            texture = new THREE.CanvasTexture(canvas);
            applyTextureSettings(texture);

            if (typeof source.close === "function") {
              source.close();
            }

            return {
              texture: texture,
              originalWidth: originalWidth,
              originalHeight: originalHeight
            };
          });
        }

        function loadImageSource(url) {
          if (typeof createImageBitmap === "function") {
            return fetch(url, { mode: "cors", cache: "no-cache" })
              .then(function onFetch(response) {
                if (!response.ok) {
                  throw new Error("image fetch failed");
                }
                return response.blob();
              })
              .then(function onBlob(blob) {
                return createImageBitmap(blob);
              })
              .catch(function fallbackToImage() {
                return loadImageElement(url);
              });
          }
          return loadImageElement(url);
        }

        function loadImageElement(url) {
          return new Promise(function loadImage(resolve, reject) {
            var image = new Image();
            image.crossOrigin = "anonymous";
            image.decoding = "async";
            image.onload = function onLoad() {
              resolve(image);
            };
            image.onerror = function onError() {
              reject(new Error("image failed"));
            };
            image.src = url;
          });
        }

        function applyTextureSettings(texture) {
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;
          texture.generateMipmaps = false;
          if ("colorSpace" in texture && THREE.SRGBColorSpace) {
            texture.colorSpace = THREE.SRGBColorSpace;
          } else if ("encoding" in texture && THREE.sRGBEncoding) {
            texture.encoding = THREE.sRGBEncoding;
          }
          texture.needsUpdate = true;
        }

        function moveSelection(delta) {
          if (fixedPanoramaNo || externalImageUrl || !state.items.length) {
            return;
          }
          selectScene((state.currentIndex + delta + state.items.length) % state.items.length);
        }

        function toggleAutorotate() {
          state.autorotate = state.viewerController.toggleAutorotate();
          updateAutorotateText();
        }

        function updateAutorotateText() {
          refs.autorotateBtn.textContent = state.autorotate ? "关闭自动旋转" : "开启自动旋转";
        }

        function updateModeButtons() {
          refs.modeButtons.forEach(function updateButton(button) {
            var isActive = button.getAttribute("data-mode") === previewMode;
            button.classList.toggle("active", isActive);
            button.setAttribute("aria-pressed", isActive ? "true" : "false");
          });
        }

        function toggleFullscreen() {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
          } else {
            document.exitFullscreen();
          }
        }
      })();
    </script>
  </body>
</html>
