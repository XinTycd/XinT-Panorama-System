<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/assets/psv.css" />
    <title>XinT-Panorama-System Widget</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --panel: rgba(7, 7, 7, 0.9);
        --line: #2b2b2b;
        --line-strong: #5f5f5f;
        --text: #f4f4f4;
        --text-soft: #b8b8b8;
        --white: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: "Segoe UI Variable", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      button {
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      .shell {
        width: 100%;
        height: 100%;
      }
      .viewer-shell {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 220px;
        overflow: hidden;
        background: #050505;
      }
      #viewer {
        width: 100%;
        height: 100%;
      }
      #viewer canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #viewer canvas:active {
        cursor: grabbing;
      }
      .viewer-shell.is-legacy #prevBtn,
      .viewer-shell.is-legacy #nextBtn,
      .viewer-shell.is-legacy #autorotateBtn,
      .viewer-shell.is-legacy #focusBtn,
      .viewer-shell.is-legacy #directorBtn,
      .viewer-shell.is-legacy #resetBtn,
      .viewer-shell.is-legacy #fullscreenBtn { display: none !important; }
      .viewer-shell.is-legacy .toolbar { left: auto; right: 14px; bottom: 14px; gap: 8px; padding: 0; }
      .viewer-shell.is-legacy #zoomOutBtn:not([hidden]),
      .viewer-shell.is-legacy #zoomInBtn:not([hidden]) { width: 44px; min-width: 44px; height: 44px; min-height: 44px; justify-content: center; padding: 0; border-color: rgba(255,255,255,0.38); border-radius: 50%; color: var(--white); background: rgba(7,7,7,0.76); box-shadow: 0 4px 14px rgba(0,0,0,0.25); font-size: 0; }
      .viewer-shell.is-legacy #zoomOutBtn:not([hidden])::before,
      .viewer-shell.is-legacy #zoomInBtn:not([hidden])::before { font-size: 23px; line-height: 1; }
      .viewer-shell.is-legacy #zoomOutBtn:not([hidden])::before { content: "−"; }
      .viewer-shell.is-legacy #zoomInBtn:not([hidden])::before { content: "+"; }
      .viewer-shell, #viewer { background: #111; }
      .viewer-feedback { position: absolute; z-index: 4; top: 50%; left: 50%; max-width: calc(100% - 32px); padding: 9px 13px; transform: translate(-50%, -50%); border: 1px solid rgba(255,255,255,0.13); border-radius: 7px; color: rgba(255,255,255,0.92); background: rgba(24,24,24,0.82); font-size: 13px; text-align: center; overflow-wrap: anywhere; pointer-events: none; }
      .viewer-feedback[hidden] { display: none !important; }
      .toolbar { position: absolute; z-index: 5; left: 50%; right: auto; bottom: 12px; display: flex; align-items: center; max-width: calc(100% - 24px); flex-wrap: nowrap; gap: 6px; overflow-x: auto; padding: 6px; transform: translateX(-50%); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; background: rgba(28,28,28,0.78); box-shadow: 0 6px 20px rgba(0,0,0,0.22); backdrop-filter: blur(12px); scrollbar-width: none; }
      .toolbar::-webkit-scrollbar { display: none; }
      .button { width: 44px; min-width: 44px; height: 44px; min-height: 44px; display: grid; place-items: center; justify-content: center; padding: 0; border: 1px solid transparent; border-radius: 7px; color: rgba(255,255,255,0.92); background: transparent; cursor: pointer; font-size: 21px; line-height: 1; }
      .button:hover, .button:focus-visible { border-color: rgba(255,255,255,0.14); background: rgba(255,255,255,0.12); }
      .button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .button[aria-pressed="true"] { background: rgba(255,255,255,0.16); }
      .viewer-shell.is-legacy .toolbar { left: auto; right: 12px; bottom: 12px; transform: none; }
      @media (max-width: 640px) { .viewer-shell.is-legacy .toolbar { left: auto; right: 10px; } }
      </style>
  </head>
  <body>
    <div class="shell">
      <div class="viewer-shell">
        <div id="viewer"></div>
        <div id="statusText" class="viewer-feedback" data-control="status" role="status" aria-live="polite">加载中...</div>
        <div class="toolbar" role="toolbar" aria-label="全景查看工具">
          <button id="prevBtn" class="button" data-control="previous" type="button" aria-label="上一张" title="上一张">‹</button>
          <button id="nextBtn" class="button" data-control="next" type="button" aria-label="下一张" title="下一张">›</button>
          <button id="autorotateBtn" class="button" data-control="autorotate" type="button" aria-label="自动旋转" title="自动旋转" aria-pressed="false">↻</button>
          <button id="zoomOutBtn" class="button" data-control="zoom-out" type="button" aria-label="缩小视野" title="缩小视野">−</button>
          <button id="zoomInBtn" class="button" data-control="zoom-in" type="button" aria-label="放大细节" title="放大细节">+</button>
          <button id="focusBtn" class="button" data-control="focus" type="button" aria-label="聚焦" title="聚焦" aria-pressed="false">⌕</button>
          <button id="directorBtn" class="button" data-control="director" type="button" aria-label="自动演示" title="自动演示" aria-pressed="false">▶</button>
          <button id="resetBtn" class="button" data-control="reset" type="button" aria-label="重置视角" title="重置视角">⟲</button>
          <button id="fullscreenBtn" class="button" data-control="fullscreen" type="button" aria-label="全屏预览" title="全屏预览" aria-pressed="false">⛶</button>
        </div>
      </div>
    </div>

    <script src="/assets/psv.bundle.js"></script>
    <script src="/assets/three.min.js"></script>
    <script src="/assets/legacy-viewer.js"></script>
    <script src="/assets/panorama-viewer.js"></script>
    <script>
      (function initWidget() {
        var params = new URLSearchParams(location.search);
        var apiBase = (params.get("api") || location.origin).replace(/\/$/, "");
        var fixedPanoramaNo = params.get("panoramaNo");
        var externalImageUrl = params.get("imageUrl");
        var externalImageName = params.get("imageName") || "外部全景图";
        var initialAutorotate = params.get("autorotate") === "1";
        var visibleControls = resolveVisibleControls(params.get("controls"), params.get("hideControls"));
        var refs = {
          viewer: document.getElementById("viewer"),
          statusText: document.getElementById("statusText"),
          prevBtn: document.getElementById("prevBtn"),
          nextBtn: document.getElementById("nextBtn"),
          autorotateBtn: document.getElementById("autorotateBtn"),
          zoomOutBtn: document.getElementById("zoomOutBtn"),
          zoomInBtn: document.getElementById("zoomInBtn"),
          focusBtn: document.getElementById("focusBtn"),
          directorBtn: document.getElementById("directorBtn"),
          resetBtn: document.getElementById("resetBtn"),
          fullscreenBtn: document.getElementById("fullscreenBtn"),
        };
        var state = {
          items: [],
          currentIndex: -1,
          requestId: 0,
          maxTextureSize: 4096,
          autorotate: initialAutorotate,
          viewerController: null,
          viewerReady: false,
          pageHidden: false
        };
        var viewerShell = document.querySelector(".viewer-shell");
        var statusIsFeedback = true;

        applyControlVisibility();
        bindEvents();
        fetch(apiBase + "/api/config").then(toJson).then(function useConfiguredViewer(config) {
          return config.viewer && (config.viewer.engine === "legacy" || config.viewer.engine === "psv") ? config.viewer.engine : "psv";
        }).catch(function useDefaultViewerOnConfigFailure() {
          return "psv";
        }).then(function createConfiguredViewer(engine) {
          if (state.pageHidden) return;
          initViewer(engine);
          loadInitialData();
        }).catch(function onViewerStartupError() {
          state.viewerReady = false;
          setWidgetStatus("全景查看器无法启动，请刷新页面或联系管理员", true);
        });
        window.addEventListener("pagehide", function disposeViewer(event) {
          if (event.persisted) return;
          state.pageHidden = true;
          state.viewerReady = false;
          state.requestId += 1;
          if (state.viewerController) state.viewerController.dispose();
          state.viewerController = null;
        });

        function initViewer(engine) {
          var legacy = engine === "legacy";
          viewerShell.classList.toggle("is-legacy", legacy);
          if (legacy) {
            ["previous", "next", "autorotate", "focus", "director", "reset", "fullscreen"].forEach(function hideLegacyControl(name) {
              visibleControls[name] = false;
            });
            applyControlVisibility();
            refs.statusText.hidden = !statusIsFeedback;
            updateControlContainers();
          }
          state.viewerController = XinTPanoramaViewer.create({
            element: refs.viewer,
            engine: engine,
            autorotate: state.autorotate,
            onViewChange: updateViewControlState
          });
          state.maxTextureSize = state.viewerController.getMaxTextureSize();
          updateAutorotateText();
          updateViewControlState();
        }

        function bindEvents() {
          refs.prevBtn.addEventListener("click", function onPrev() {
            moveSelection(-1);
          });
          refs.nextBtn.addEventListener("click", function onNext() {
            moveSelection(1);
          });
          refs.autorotateBtn.addEventListener("click", toggleAutorotate);
          refs.zoomOutBtn.addEventListener("click", function onZoomOut() {
            if (!state.viewerReady || !state.viewerController) return;
            state.viewerController.zoomBy(8);
            updateViewControlState();
          });
          refs.zoomInBtn.addEventListener("click", function onZoomIn() {
            if (!state.viewerReady || !state.viewerController) return;
            state.viewerController.zoomBy(-8);
            updateViewControlState();
          });
          refs.focusBtn.addEventListener("click", toggleFocus);
          refs.directorBtn.addEventListener("click", toggleDirector);
          refs.resetBtn.addEventListener("click", function onReset() {
            state.viewerController.resetView();
            updateViewControlState();
          });
          refs.fullscreenBtn.addEventListener("click", toggleFullscreen);
          document.addEventListener("fullscreenchange", updateFullscreenButton);
        }

        function loadInitialData() {
          if (externalImageUrl) {
            hidePaging();
            state.items = [
              {
                id: "external-image",
                panoramaNo: null,
                name: externalImageName,
                sourceType: "external-url",
                viewerUrl: apiBase + "/api/panoramas/proxy?url=" + encodeURIComponent(externalImageUrl)
              }
            ];
            selectScene(0);
            return;
          }

          if (fixedPanoramaNo) {
            hidePaging();
            fetch(apiBase + "/api/panoramas/by-no?no=" + encodeURIComponent(fixedPanoramaNo))
              .then(toJson)
              .then(function onPayload(payload) {
                state.items = payload.item ? [payload.item] : [];
                if (!state.items.length) {
                  throw new Error("not found");
                }
                if (state.items[0].sourceType === "client-upload") {
                  state.items = [];
                  setWidgetStatus("该图片仅在上传它的浏览器中可见", true);
                  return;
                }
                selectScene(0);
              })
              .catch(function onError() {
                setWidgetStatus("指定编号的全景图不存在", true);
              });
            return;
          }

          fetch(apiBase + "/api/gallery")
            .then(toJson)
            .then(function onPayload(payload) {
              state.items = (payload.items || []).filter(function isShared(item) {
                return item.sourceType !== "client-upload";
              });
              if (!state.items.length) {
                setWidgetStatus("暂无可用全景图", true);
                return;
              }
              selectScene(0);
            })
            .catch(function onError() {
              setWidgetStatus("后端不可用", true);
            });
        }

        function hidePaging() {
          refs.prevBtn.hidden = true;
          refs.nextBtn.hidden = true;
          updateControlContainers();
        }

        function toJson(response) {
          if (!response.ok) {
            throw new Error("request failed");
          }
          return response.json();
        }

        function selectScene(index) {
          if (!state.viewerController || state.pageHidden || index < 0 || index >= state.items.length) {
            return;
          }

          var item = state.items[index];
          var controller = state.viewerController;
          var requestId = ++state.requestId;
          state.currentIndex = index;
          state.viewerReady = false;
          setWidgetStatus("加载中...", true);

          controller.setPanorama(item.viewerUrl)
            .then(function onLoaded(loaded) {
              if (requestId !== state.requestId || controller !== state.viewerController) return;

              if (loaded.stale) return;
              state.viewerReady = true;
              setWidgetStatus("已就绪: " + item.name, false);
            })
            .catch(function onError() {
              if (requestId !== state.requestId || controller !== state.viewerController) return;
              state.viewerReady = false;
              controller.clear();
              setWidgetStatus("加载失败", true);
            });
        }

        function moveSelection(delta) {
          if (fixedPanoramaNo || externalImageUrl || !state.items.length) {
            return;
          }
          selectScene((state.currentIndex + delta + state.items.length) % state.items.length);
        }

        function toggleAutorotate() {
          if (!state.viewerReady || !state.viewerController) return;
          state.autorotate = state.viewerController.toggleAutorotate();
          updateAutorotateText();
          updateDirectorText();
        }

        function updateAutorotateText() {
          var label = state.autorotate ? "停止旋转" : "自动旋转";
          refs.autorotateBtn.textContent = "↻";
          setAttributeIfChanged(refs.autorotateBtn, "aria-label", label);
          if (refs.autorotateBtn.title !== label) refs.autorotateBtn.title = label;
        }

        function toggleFocus() {
          if (!state.viewerReady || !state.viewerController) return;
          var view = state.viewerController.getView();
          var isFocused = view.fov <= 42;
          state.viewerController.stopDirector();
          state.viewerController.setView({ fov: isFocused ? 75 : 36 }, 320);
          state.autorotate = false;
          updateAutorotateText();
          updateDirectorText();
          refs.focusBtn.setAttribute("aria-pressed", isFocused ? "false" : "true");
          refs.focusBtn.setAttribute("aria-label", isFocused ? "聚焦视野" : "退出聚焦");
          refs.focusBtn.title = isFocused ? "聚焦视野" : "退出聚焦";
        }

        function toggleDirector() {
          if (!state.viewerReady || !state.viewerController) return;
          if (state.viewerController.isDirectorPlaying()) {
            state.viewerController.stopDirector();
          } else {
            var view = state.viewerController.getView();
            state.viewerController.playDirector(
              [
                { yaw: view.yaw, pitch: view.pitch, fov: view.fov, duration: 1200, hold: 500 },
                { yaw: view.yaw + 72, pitch: -7, fov: 58, duration: 3600, hold: 650 },
                { yaw: view.yaw + 152, pitch: 6, fov: 46, duration: 4200, hold: 700 },
                { yaw: view.yaw + 242, pitch: 0, fov: 68, duration: 4200, hold: 550 }
              ],
              { loop: true }
            );
            state.autorotate = false;
            updateAutorotateText();
          }
          updateDirectorText();
        }

        function updateViewControlState(view) {
          if (!state.viewerController) {
            return;
          }
          state.autorotate = state.viewerController.getAutorotate();
          updateAutorotateText();
          var currentView = view || state.viewerController.getView();
          var focused = currentView.fov <= 42;
          setAttributeIfChanged(refs.focusBtn, "aria-pressed", focused ? "true" : "false");
          setAttributeIfChanged(refs.focusBtn, "aria-label", focused ? "退出聚焦" : "聚焦视野");
          var focusTitle = focused ? "退出聚焦" : "聚焦视野";
          if (refs.focusBtn.title !== focusTitle) refs.focusBtn.title = focusTitle;
          updateDirectorText();
        }

        function updateDirectorText() {
          if (!state.viewerController) {
            return;
          }
          var isPlaying = state.viewerController.isDirectorPlaying();
          refs.directorBtn.textContent = isPlaying ? "Ⅱ" : "▶";
          refs.directorBtn.classList.toggle("active", isPlaying);
          setAttributeIfChanged(refs.directorBtn, "aria-pressed", isPlaying ? "true" : "false");
          var directorLabel = isPlaying ? "停止自动演示" : "自动演示";
          setAttributeIfChanged(refs.directorBtn, "aria-label", directorLabel);
          if (refs.directorBtn.title !== directorLabel) refs.directorBtn.title = directorLabel;
          var directorText = isPlaying ? "Ⅱ" : "▶";
          if (refs.directorBtn.textContent !== directorText) refs.directorBtn.textContent = directorText;
        }

        function setAttributeIfChanged(element, name, value) {
          value = String(value);
          if (element.getAttribute(name) !== value) element.setAttribute(name, value);
        }

        async function toggleFullscreen() {
          try {
            if (!document.fullscreenElement) {
              if (document.fullscreenEnabled === false || !document.documentElement.requestFullscreen) throw new Error("当前浏览器不支持全屏");
              await document.documentElement.requestFullscreen();
            } else {
              if (!document.exitFullscreen) throw new Error("当前浏览器不支持退出全屏");
              await document.exitFullscreen();
            }
          } catch (error) {
            setWidgetStatus(error && error.message || "全屏操作失败", true);
          }
        }

        function updateFullscreenButton() {
          var active = Boolean(document.fullscreenElement);
          refs.fullscreenBtn.setAttribute("aria-pressed", active ? "true" : "false");
          refs.fullscreenBtn.setAttribute("aria-label", active ? "退出全屏" : "全屏预览");
          refs.fullscreenBtn.title = active ? "退出全屏" : "全屏预览";
          refs.fullscreenBtn.textContent = "⛶";
        }

        function resolveVisibleControls(controlsValue, hiddenValue) {
          var allControls = [
            "status",
            "previous",
            "next",
            "autorotate",
            "zoom-in",
            "zoom-out",
            "focus",
            "director",
            "reset",
            "fullscreen"
          ];
          var defaultControls = allControls.filter(function useDefaultControl(name) {
            return name !== "director";
          });
          var requested = parseControlList(controlsValue, allControls);
          var hidden = parseControlList(hiddenValue, allControls);
          var visible = {};

          getBaseControls(requested, allControls, defaultControls).forEach(function addControl(name) {
            visible[name] = true;
          });

          getHiddenControls(hidden, allControls, defaultControls).forEach(function removeControl(name) {
            delete visible[name];
          });

          return visible;
        }

        function parseControlList(value, allControls) {
          var allowed = {};
          var result = {
            keys: [],
            specials: []
          };

          allControls.forEach(function allowControl(name) {
            allowed[name] = true;
          });

          if (!value) {
            return result;
          }

          value.split(",").forEach(function parseToken(rawToken) {
            var token = rawToken.trim().toLowerCase();
            if (Object.prototype.hasOwnProperty.call(allowed, token) && result.keys.indexOf(token) === -1) {
              result.keys.push(token);
            } else if (
              (token === "all" || token === "none" || token === "default") &&
              result.specials.indexOf(token) === -1
            ) {
              result.specials.push(token);
            }
          });

          return result;
        }

        function getBaseControls(parsed, allControls, defaultControls) {
          if (parsed.keys.length) {
            return parsed.keys;
          }
          if (parsed.specials.length !== 1) {
            return defaultControls;
          }
          if (parsed.specials[0] === "all") {
            return allControls;
          }
          if (parsed.specials[0] === "none") {
            return [];
          }
          return defaultControls;
        }

        function getHiddenControls(parsed, allControls, defaultControls) {
          if (parsed.keys.length) {
            return parsed.keys;
          }
          if (parsed.specials.length !== 1 || parsed.specials[0] === "none") {
            return [];
          }
          return parsed.specials[0] === "all" ? allControls : defaultControls;
        }

        function applyControlVisibility() {
          Array.prototype.forEach.call(document.querySelectorAll("[data-control]"), function updateControl(element) {
            element.hidden = !visibleControls[element.getAttribute("data-control")];
          });
          updateControlContainers();
        }

        function updateControlContainers() {
          [document.querySelector(".hud"), document.querySelector(".toolbar")].forEach(
            function updateContainer(container) {
              if (!container) {
                return;
              }
              container.hidden = !Array.prototype.some.call(container.querySelectorAll("[data-control]"), function isVisible(element) {
                return !element.hidden;
              });
            }
          );
        }

        function setWidgetStatus(message, feedback) {
          statusIsFeedback = feedback === true;
          refs.statusText.textContent = message;
          refs.statusText.hidden = !statusIsFeedback;
          updateControlContainers();
        }
      })();
    </script>
  </body>
</html>
